name: Archive Gmail

on:
  schedule:
    - cron: "17 * * * *"   # every hour at minute 17 (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only report what would be archived"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Archive inbox mail older than 5 days
        run: python3 archive_gmail.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DAYS_OLD: "5"
          SKIP_STARRED: "true"
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
